[project]
name = "pager"
version = "0.1.0"
description = "PAGER – geführte Prompt-Walkthroughs für GitHub Copilot"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PySide6-Essentials>=6.7",
    "pydantic>=2.7",
    "PyYAML>=6.0",
    "Jinja2>=3.1",
    "platformdirs>=4.2",
    "openpyxl>=3.1",
    "pypdf>=4.2",
    "markdown>=3.11.3",
]

[project.gui-scripts]
pager = "pager.app:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pyinstaller>=6.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pager"]

[tool.pytest.ini_options]
testpaths = ["tests"]
