# Baut PAGER für Windows (.exe) und macOS (.app) und veröffentlicht beides als GitHub-Release.
# Auslöser: ein Tag „v*“ (z. B. git tag v0.2.0 && git push origin v0.2.0) oder manuell (nur Build).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --onefile --package
          - os: macos-latest   # Apple Silicon (arm64)
            args: --package
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - name: Abhängigkeiten
        run: uv sync --python 3.12
      - name: Tests
        run: uv run pytest -q
      - name: Build
        run: uv run python scripts/build.py ${{ matrix.args }}
      - name: Starttest (App muss 15 s ohne Absturz laufen)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then apps="dist/PAGER/PAGER.exe dist/onefile/PAGER.exe"; else apps="dist/PAGER.app/Contents/MacOS/PAGER"; fi
          for app in $apps; do
            "$app" & pid=$!
            sleep 15
            if ! kill -0 $pid 2>/dev/null; then echo "::error::$app ist beim Start abgestürzt"; exit 1; fi
            kill $pid || true
            echo "OK: $app"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: pager-${{ matrix.os }}
          path: release/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Release veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la release
          gh release create "$GITHUB_REF_NAME" release/* \
            --title "PAGER ${GITHUB_REF_NAME#v}" \
            --notes-file .github/release-notes.md
